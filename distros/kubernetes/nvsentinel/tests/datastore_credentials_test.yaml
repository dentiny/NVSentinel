suite: datastore credentials
templates:
  - templates/configmap-datastore.yaml
  - templates/configmap.yaml
  - templates/daemonset.yaml
tests:
  - it: injects PostgreSQL password from an existing Secret
    set:
      global.datastore:
        provider: postgresql
        credentialsFromSecret:
          name: nvsentinel-phx-pg
        connection:
          host: 10.140.96.10
          port: 5432
          database: nvsentinel_oci_phx
          username: nvsentinel_oci_phx
          sslmode: require
    template: templates/daemonset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: nvsentinel-phx-pg
              optional: false

  - it: keeps the PostgreSQL password out of the generated ConfigMap
    set:
      global.datastore:
        provider: postgresql
        credentialsFromSecret:
          name: nvsentinel-phx-pg
        connection:
          host: 10.140.96.10
          port: 5432
          database: nvsentinel_oci_phx
          username: nvsentinel_oci_phx
          sslmode: require
    template: templates/configmap-datastore.yaml
    asserts:
      - notExists:
          path: data.DATASTORE_PASSWORD
      - equal:
          path: data.DATASTORE_SSLMODE
          value: require

  - it: rejects PostgreSQL without a credential Secret
    set:
      global.datastore:
        provider: postgresql
        connection:
          host: 10.140.96.10
          port: 5432
          database: nvsentinel_oci_phx
          username: nvsentinel_oci_phx
          sslmode: require
    template: templates/configmap-datastore.yaml
    asserts:
      - failedTemplate:
          errorMessage: global.datastore.credentialsFromSecret.name is required for PostgreSQL; create a Secret with key DATASTORE_PASSWORD
